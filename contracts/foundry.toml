[profile.default]
src     = "src"
out     = "out"
libs    = ["lib"]
test    = "test"
script  = "script"
cache   = true
solc_version   = "0.8.26"
optimizer      = true
optimizer_runs = 200
via_ir         = false
ffi            = false
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@account-abstraction/=lib/account-abstraction/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 256

[rpc_endpoints]
robinhood         = "${RH_RPC_URL}"
robinhood_testnet = "${RH_TESTNET_RPC_URL}"
localhost         = "http://localhost:8545"

# Blockscout verifier (Robinhood Chain) — not Basescan
[etherscan]
robinhood = { key = "${BLOCKSCOUT_API_KEY}", url = "${BLOCKSCOUT_API_URL}" }
robinhood_testnet = { key = "${BLOCKSCOUT_API_KEY}", url = "${BLOCKSCOUT_TESTNET_API_URL}" }

[fmt]
line_length     = 100
tab_width       = 4
bracket_spacing = true
