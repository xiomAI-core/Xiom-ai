name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'

jobs:
  build:
    name: Build Desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos
            os: macos-latest
            args: ''
          - target: windows-x64
            os: windows-latest
            args: ''
          - target: windows-arm64
            # Prefer windows-11-arm when available on the org; falls back to cross notes
            os: windows-11-arm
            args: '--target aarch64-pc-windows-msvc'
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.target == 'windows-arm64' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'windows-arm64' && 'aarch64-pc-windows-msvc' || '' }}
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Tauri app
        run: pnpm --filter @xiom/desktop exec tauri build ${{ matrix.args }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/
            apps/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/

  release:
    name: Soft release
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release (soft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Desktop ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
