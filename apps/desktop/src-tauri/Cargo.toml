[package]
name = "xiom-desktop"
version = "0.1.0"
description = "XIOM Desktop — Personal AI Operating System"
authors = ["XIOM Team"]
license = "MIT"
repository = "https://github.com/xiom-ai/xiom"
edition = "2021"
rust-version = "1.77"

[lib]
name = "xiom_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "xiom-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ─── Tauri ──────────────────────────────────────────────────
tauri                     = { version = "2", features = [ "tray-icon"] }
tauri-plugin-shell        = "2"
tauri-plugin-notification = "2"
tauri-plugin-store        = "2"
tauri-plugin-updater      = "2"
tauri-plugin-process      = "2"

# ─── Database ───────────────────────────────────────────────
neo4rs   = "0.7"
rusqlite = { version = "0.31", features = ["bundled"] }

# ─── HTTP / Async ───────────────────────────────────────────
axum       = "0.7"
tower      = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
tokio      = { version = "1", features = ["full"] }

# ─── Serialization ──────────────────────────────────────────
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# ─── Utilities ──────────────────────────────────────────────
uuid    = { version = "1", features = ["v4"] }
chrono  = { version = "0.4", features = ["serde"] }
sha2    = "0.10"
hex     = "0.4"
anyhow  = "1"

# ─── Logging ────────────────────────────────────────────────
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto           = true
opt-level     = "s"
panic         = "abort"
strip         = true
